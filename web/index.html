<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPU Scheduling Simulator</title>
<style>
:root{--bg:#090c10;--panel:#0f141b;--panel2:#141b24;--line:#1f2937;--text:#d7e0ea;--mute:#7b8a9b;--acc:#35f0a5;--acc2:#4cc9f0;--warn:#ffb454;--bad:#ff5d73;
--mono:ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,#10261f55,transparent),var(--bg);color:var(--text);font:14px/1.5 var(--mono)}
header{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#04120c;font-weight:800}
h1{font-size:16px;margin:0;letter-spacing:.04em}h1 small{display:block;color:var(--mute);font-weight:400;font-size:11px;letter-spacing:.08em}
main{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:18px;padding:18px 28px;max-width:1500px;margin:auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{margin:0 0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
select,input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;width:100%;outline:none}
select:focus,input:focus{border-color:var(--acc)}
.row{display:flex;gap:10px;margin-bottom:12px}.row>div{flex:1}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 12px;transition:.15s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);color:#03130c;border-color:var(--acc);font-weight:700}
button.primary:hover{filter:brightness(1.1);color:#03130c}
button.ghost{padding:4px 8px;font-size:12px;color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
table{width:100%;border-collapse:collapse}
th{font-size:10px;color:var(--mute);text-align:left;text-transform:uppercase;letter-spacing:.1em;padding:4px 6px}
td{padding:3px 4px}td input{padding:6px 8px}
.res td,.res th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}.res th:first-child,.res td:first-child{text-align:left}
.res tfoot td{color:var(--acc);font-weight:700;border-bottom:0}
.chip{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:22px;color:var(--acc)}.kpi span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.gantt{position:relative;height:56px;margin:6px 0 34px;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--u) - 1px),#ffffff08 calc(var(--u) - 1px) var(--u));border-radius:8px}
.seg{position:absolute;top:0;height:100%;border-radius:6px;display:grid;place-items:center;font-weight:700;color:#04120c;overflow:hidden;
transform-origin:left;animation:grow .5s cubic-bezier(.2,.8,.2,1) backwards;border:1px solid #0006}
.seg.idle{background:repeating-linear-gradient(45deg,#1b2430 0 6px,#161d27 6px 12px)!important;color:var(--mute);font-weight:400}
.tick{position:absolute;top:60px;font-size:11px;color:var(--mute);transform:translateX(-50%)}
@keyframes grow{from{transform:scaleX(0);opacity:0}}
.bar{display:grid;grid-template-columns:190px 1fr 60px;align-items:center;gap:10px;margin:7px 0;font-size:12px}
.bar i{display:block;height:14px;border-radius:4px;background:linear-gradient(90deg,var(--acc2),var(--acc2)88);transition:width .6s}
.bar.best i{background:linear-gradient(90deg,var(--acc),#35f0a5aa)}.bar.best span{color:var(--acc)}
.hist{max-height:260px;overflow:auto}
.h{display:flex;justify-content:space-between;gap:8px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.h:hover{background:var(--panel2);border-color:var(--line)}.h small{color:var(--mute);display:block}
.empty{color:var(--mute);padding:20px;text-align:center}
#toast{position:fixed;bottom:22px;right:22px;background:var(--panel2);border:1px solid var(--bad);color:var(--bad);padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:360px}
#toast.show{opacity:1;transform:none}#toast.ok{border-color:var(--acc);color:var(--acc)}
.hint{font-size:11px;color:var(--mute);margin-top:8px}
</style>
</head>
<body>
<header><div class="logo">▶</div><h1>CPU SCHEDULING SIMULATOR<small>FCFS · SJF · SRTF · PRIORITY · ROUND ROBIN</small></h1></header>
<main>
<div class="col">
  <section class="card">
    <h2>Configuration</h2>
    <div class="row">
      <div><label>Algorithm</label><select id="algo"></select></div>
      <div id="qbox" style="max-width:110px"><label>Quantum</label><input id="quantum" type="number" min="1" value="2"></div>
    </div>
    <h2 style="margin-top:6px">Processes <button class="ghost" id="add">+ add</button></h2>
    <table><thead><tr><th>PID</th><th>Arrival</th><th>Burst</th><th>Prio</th><th></th></tr></thead><tbody id="procs"></tbody></table>
    <div class="hint">Priority: lower number = higher priority.</div>
    <div class="btns">
      <button class="primary" id="run">▶ Run simulation</button>
      <button id="compare">⇄ Compare all</button>
      <button id="sample">Sample</button>
      <button id="random">Random</button>
    </div>
  </section>
  <section class="card">
    <h2>Saved runs <span id="count"></span></h2>
    <div class="hist" id="hist"></div>
  </section>
</div>
<div class="col">
  <section class="card">
    <h2><span id="title">Gantt chart</span><span><button class="ghost" id="save">💾 save</button> <button class="ghost" id="csv">⬇ CSV</button></span></h2>
    <div id="out"><div class="empty">Add processes and press <b>Run simulation</b>.</div></div>
  </section>
  <section class="card" id="cmpCard" style="display:none">
    <h2>Algorithm comparison — average waiting time</h2><div id="cmp"></div>
  </section>
</div>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const ALGOS={fcfs:"FCFS",sjf:"SJF (non-preemptive)",srtf:"SRTF (preemptive SJF)",priority:"Priority (non-preemptive)",priority_p:"Priority (preemptive)",rr:"Round Robin"};
const SAMPLE=[["P1",0,5,2],["P2",1,3,1],["P3",2,8,4],["P4",3,2,3],["P5",9,4,1]];
let procs=[],last=null;
const color=pid=>{const n=parseInt(pid.replace(/\D/g,""))||[...pid].reduce((a,c)=>a+c.charCodeAt(0),0);return`hsl(${(n*47)%360} 85% 62%)`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ok){const t=$("#toast");t.textContent=m;t.className="show"+(ok?" ok":"");clearTimeout(t._t);t._t=setTimeout(()=>t.className="",3200)}
async function api(path,method="GET",body){
  const r=await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body&&JSON.stringify(body)});
  if(r.status===204)return null;
  const ct=r.headers.get("content-type")||"";
  const d=ct.includes("json")?await r.json():await r.blob();
  if(!r.ok)throw new Error(d.error||r.statusText);return d;
}
const payload=()=>({algorithm:$("#algo").value,quantum:+$("#quantum").value||0,processes:procs.map(p=>({pid:p.pid.trim(),arrival:+p.arrival,burst:+p.burst,priority:+p.priority}))});

function renderProcs(){
  $("#procs").innerHTML=procs.map((p,i)=>`<tr>
   <td><input data-i="${i}" data-k="pid" value="${esc(p.pid)}" style="width:70px"></td>
   ${["arrival","burst","priority"].map(k=>`<td><input type="number" min="0" data-i="${i}" data-k="${k}" value="${p[k]}"></td>`).join("")}
   <td><button class="ghost" data-del="${i}">✕</button></td></tr>`).join("");
}
$("#procs").addEventListener("input",e=>{const i=e.target.dataset.i;if(i!==undefined)procs[i][e.target.dataset.k]=e.target.value});
$("#procs").addEventListener("click",e=>{const d=e.target.dataset.del;if(d!==undefined){procs.splice(+d,1);renderProcs()}});
const nextPid=()=>{let n=procs.length+1;while(procs.some(p=>p.pid==="P"+n))n++;return"P"+n};
$("#add").onclick=()=>{procs.push({pid:nextPid(),arrival:0,burst:3,priority:1});renderProcs()};
$("#sample").onclick=()=>{procs=SAMPLE.map(([pid,arrival,burst,priority])=>({pid,arrival,burst,priority}));renderProcs()};
$("#random").onclick=()=>{const n=4+Math.floor(Math.random()*4),r=m=>Math.floor(Math.random()*m);
  procs=Array.from({length:n},(_,i)=>({pid:"P"+(i+1),arrival:r(10),burst:1+r(9),priority:1+r(5)}));renderProcs()};
$("#algo").innerHTML=Object.entries(ALGOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
$("#algo").onchange=()=>$("#qbox").style.visibility=$("#algo").value==="rr"?"visible":"hidden";

function renderResult(r){
  last=r;
  const total=r.makespan,u=100/total;
  const ticks=[...new Set([0,...r.segments.map(s=>s.end)])];
  const segs=r.segments.map((s,i)=>`<div class="seg ${s.pid==="IDLE"?"idle":""}" title="${s.pid}: ${s.start}→${s.end}"
    style="left:${s.start*u}%;width:${(s.end-s.start)*u}%;background:${s.pid==="IDLE"?"":color(s.pid)};animation-delay:${i*60}ms">${s.end-s.start>=Math.max(1,total/40)?s.pid:""}</div>`).join("");
  const tk=ticks.map(t=>`<span class="tick" style="left:${t*u}%">${t}</span>`).join("");
  const rows=r.metrics.map(m=>`<tr><td><span class="chip" style="background:${color(m.pid)}"></span>${esc(m.pid)}</td><td>${m.arrival}</td><td>${m.burst}</td><td>${m.ct}</td><td>${m.tat}</td><td>${m.wt}</td><td>${m.rt}</td></tr>`).join("");
  $("#title").textContent=r.label+(r.quantum?` · q=${r.quantum}`:"");
  $("#out").innerHTML=`<div class="gantt" style="--u:${u}%">${segs}${tk}</div>
  <div class="kpis">
   <div class="kpi"><b>${r.avg_wt}</b><span>Avg waiting</span></div><div class="kpi"><b>${r.avg_tat}</b><span>Avg turnaround</span></div>
   <div class="kpi"><b>${r.avg_rt}</b><span>Avg response</span></div><div class="kpi"><b>${r.cpu_util}%</b><span>CPU utilisation</span></div>
   <div class="kpi"><b>${r.throughput}</b><span>Throughput /unit</span></div></div>
  <table class="res" style="margin-top:16px"><thead><tr><th>PID</th><th>AT</th><th>BT</th><th>CT</th><th>TAT</th><th>WT</th><th>RT</th></tr></thead>
  <tbody>${rows}</tbody><tfoot><tr><td>AVG</td><td></td><td></td><td></td><td>${r.avg_tat}</td><td>${r.avg_wt}</td><td>${r.avg_rt}</td></tr></tfoot></table>`;
}
$("#run").onclick=async()=>{try{renderResult(await api("/api/simulate","POST",payload()))}catch(e){toast(e.message)}};
$("#compare").onclick=async()=>{try{
  const list=await api("/api/compare","POST",payload()),max=Math.max(...list.map(r=>r.avg_wt),1),min=Math.min(...list.map(r=>r.avg_wt));
  $("#cmp").innerHTML=list.map(r=>`<div class="bar ${r.avg_wt===min?"best":""}"><span>${r.label}</span><i style="width:${Math.max(r.avg_wt/max*100,2)}%"></i><span>${r.avg_wt}</span></div>`).join("")
   +`<div class="hint">Round Robin uses the quantum on the left (default 2). Highlighted = lowest average waiting time.</div>`;
  $("#cmpCard").style.display="block";
}catch(e){toast(e.message)}};
$("#csv").onclick=async()=>{try{
  const b=await api("/api/csv","POST",payload()),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=`schedule-${$("#algo").value}.csv`;a.click();
}catch(e){toast(e.message)}};
$("#save").onclick=async()=>{try{
  const name=prompt("Name this run:",ALGOS[$("#algo").value]);if(name===null)return;
  await api("/api/runs","POST",{...payload(),name});toast("Run saved",true);loadHist();
}catch(e){toast(e.message)}};

async function loadHist(){
  const runs=await api("/api/runs");$("#count").textContent=runs.length?runs.length+" stored":"";
  $("#hist").innerHTML=runs.length?runs.map(r=>`<div class="h" data-id="${r.id}"><div>${esc(r.name)}<small>${ALGOS[r.algorithm]} · WT ${r.avg_wt} · ${r.created_at}</small></div><button class="ghost" data-rm="${r.id}">✕</button></div>`).join("")
   :`<div class="empty">No saved runs yet.</div>`;
}
$("#hist").onclick=async e=>{
  try{
    if(e.target.dataset.rm){await api("/api/runs/"+e.target.dataset.rm,"DELETE");return loadHist()}
    const row=e.target.closest(".h");if(!row)return;
    const r=await api("/api/runs/"+row.dataset.id);
    procs=r.processes.map(p=>({...p}));$("#algo").value=r.algorithm;$("#quantum").value=r.quantum||2;$("#algo").onchange();
    renderProcs();renderResult(r.result);
  }catch(err){toast(err.message)}
};
$("#sample").click();$("#algo").onchange();loadHist();
</script>
</body>
</html>
